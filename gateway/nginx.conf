events {}
http {
  log_format json escape=json '{"time":"$time_iso8601","service":"api-gateway","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout json;
  server {
    listen 8000;
    add_header X-Request-ID $request_id always;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    location /auth/ { proxy_pass http://auth-service:8081; }
    location /admin/users/ { proxy_pass http://auth-service:8081; }
    location /products { proxy_pass http://product-service:8082; }
    location /orders { proxy_pass http://order-service:8083; }
    location /admin/orders { proxy_pass http://order-service:8083; }
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
  }
}
