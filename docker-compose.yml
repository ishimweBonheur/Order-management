services:
  api-gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      auth-service: {condition: service_healthy}
      product-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.28.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    ports: ["8080:8080"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d order_management"]
      interval: 5s
      timeout: 5s
      retries: 10
  database-migrations:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./docker/migrations:/migrations:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "app", "-d", "order_management", "-f", "/migrations/001_schema.sql"]
    depends_on:
      postgres: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports: ["8090:8080"]
    depends_on:
      kafka: {condition: service_healthy}
  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: {condition: service_healthy}
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "order.created", "--partitions", "1", "--replication-factor", "1"]
  auth-service:
    build: {context: ./auth-service, dockerfile: Dockerfile}
    environment: &common
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HTTP_PORT: ${AUTH_HTTP_PORT:?Set AUTH_HTTP_PORT in .env}
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: {database-migrations: {condition: service_completed_successfully}}
  product-service:
    build: {context: ./product-service, dockerfile: Dockerfile}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HTTP_PORT: ${PRODUCT_HTTP_PORT:?Set PRODUCT_HTTP_PORT in .env}
      REDIS_ADDR: ${REDIS_ADDR:?Set REDIS_ADDR in .env}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:?Set REDIS_CACHE_TTL in .env}
      REDIS_DB: ${REDIS_DB:?Set REDIS_DB in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS in .env}
      KAFKA_PRODUCT_TOPIC: ${KAFKA_PRODUCT_TOPIC:?Set KAFKA_PRODUCT_TOPIC in .env}
      ENVIRONMENT: ${ENVIRONMENT:?Set ENVIRONMENT in .env}
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: {database-migrations: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  order-service:
    build: {context: ./order-service, dockerfile: Dockerfile}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      HTTP_PORT: ${ORDER_HTTP_PORT:?Set ORDER_HTTP_PORT in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS in .env}
      KAFKA_ORDER_TOPIC: ${KAFKA_ORDER_TOPIC:?Set KAFKA_ORDER_TOPIC in .env}
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on: {database-migrations: {condition: service_completed_successfully}, kafka-init: {condition: service_completed_successfully}}
  notification-service:
    build: {context: ./notification-service, dockerfile: Dockerfile}
    environment:
      HTTP_PORT: ${NOTIFICATION_HTTP_PORT:?Set NOTIFICATION_HTTP_PORT in .env}
      REDIS_ADDR: ${REDIS_ADDR:?Set REDIS_ADDR in .env}
      KAFKA_BROKERS: ${KAFKA_BROKERS:?Set KAFKA_BROKERS in .env}
      KAFKA_ORDER_TOPIC: ${KAFKA_ORDER_TOPIC:?Set KAFKA_ORDER_TOPIC in .env}
      KAFKA_NOTIFICATION_GROUP: ${KAFKA_NOTIFICATION_GROUP:?Set KAFKA_NOTIFICATION_GROUP in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE in .env}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
    ports: ["8084:8084"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    depends_on: {redis: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
volumes:
  postgres_data:
