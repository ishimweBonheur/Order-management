events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_origin $cors_origin {
    default "";
    "http://localhost:8080" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:5173" $http_origin;
  }
  log_format json escape=json '{"time":"$time_iso8601","service":"api-gateway","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout json;
  server {
    listen 8000;
    add_header X-Request-ID $request_id always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-Request-ID" always;
    add_header Access-Control-Max-Age 300 always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;
    location /auth/ { set $upstream http://auth-service:8081; proxy_pass $upstream; }
    location /admin/users/ { set $upstream http://auth-service:8081; proxy_pass $upstream; }
    location /products { set $upstream http://product-service:8082; proxy_pass $upstream; }
    location /orders { set $upstream http://order-service:8083; proxy_pass $upstream; }
    location /admin/orders { set $upstream http://order-service:8083; proxy_pass $upstream; }
    location = /health { default_type application/json; return 200 '{"status":"ok"}'; }
  }
}
